services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-gpt-team:local
    container_name: auto-gpt-team
    ports:
      - "5173:8080"
    volumes:
      - ./data:/app/backend/db
    env_file:
      - ./backend/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: ${NODE_ENV:-production}
      NGINX_PORT: 8080
      DATABASE_PATH: /app/backend/db/database.sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s